version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "12:00"
      timezone: America/New_York
    commit-message:
      prefix: "build"
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "12:00"
      timezone: America/New_York
    commit-message:
      prefix: "build"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "12:00"
      timezone: America/New_York
    commit-message:
      prefix: "build"
    groups:
      github-actions:
        patterns:
          - "*"
